<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><style>html,body{margin:0;height:100%}</style></helmet>
<div style="height:100vh;display:grid;grid-template-rows:48px minmax(0,1fr);background:var(--bg,#f4f6f5);font-family:var(--font-sans,system-ui)">
<nav style="display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--divider,#dde3e1);background:var(--surface,#fff)">
<strong style="font-size:14px;margin-right:8px;color:var(--ink,#16272d)">3D ULPIN mockups</strong>
<sc-if value="{{ isStudio }}" hint-placeholder-val="{{ true }}"><button onClick="{{ showStudio }}" aria-pressed="true" style="all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--primary-soft,#e3efe9);color:var(--ink,#16272d)">Officer Studio · interactive</button><button onClick="{{ showBoards }}" style="all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:transparent;color:var(--ink,#16272d)">Portal, Admin, phone and full-product boards</button></sc-if>
<sc-if value="{{ isBoards }}" hint-placeholder-val="{{ false }}"><button onClick="{{ showStudio }}" style="all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:transparent;color:var(--ink,#16272d)">Officer Studio · interactive</button><button onClick="{{ showBoards }}" aria-pressed="true" style="all:unset;cursor:pointer;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:var(--primary-soft,#e3efe9);color:var(--ink,#16272d)">Portal, Admin, phone and full-product boards</button></sc-if>
</nav>
<iframe title="3D ULPIN mockup" src="{{ src }}" style="width:100%;height:100%;border:0;display:block"></iframe>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;studio&quot;,&quot;boards&quot;],&quot;default&quot;:&quot;studio&quot;,&quot;tsType&quot;:&quot;'studio' | 'boards'&quot;}}">
class Component extends DCLogic {
  state = { view: null };
  renderVals() {
    const v = this.state.view || this.props.view || 'studio';
    const on = 'var(--primary-soft, #e3efe9)';
    return {
      src: v === 'studio' ? './Officer Studio.html' : './Portal Admin and Phone.html',
      isStudio: v === 'studio',
      isBoards: v === 'boards',
      showStudio: () => this.setState({ view: 'studio' }),
      showBoards: () => this.setState({ view: 'boards' })
    };
  }
}
</script>
</body>
</html>
