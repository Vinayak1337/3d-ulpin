<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio — reference and implementation</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7f3;color:#244335;font:15px system-ui}header{padding:24px 30px;background:white;border-bottom:1px solid #d7e1d7}h1{margin:0 0 8px;font-size:25px}p{margin:6px 0;color:#647668}nav{display:flex;gap:10px;flex-wrap:wrap;padding:18px 30px}button,a{font:inherit;color:inherit}button{padding:9px 15px;border:1px solid #bdcdbd;border-radius:5px;background:white;cursor:pointer}button[aria-pressed=true]{background:#315e49;color:white}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 24px 24px}figure{margin:0}figcaption{margin-bottom:12px;font-weight:600}img{width:100%;border:1px solid #d9e3d8;background:white}a{margin-left:15px}@media(max-width:800px){main{grid-template-columns:1fr}}</style><header><h1>Reference → implemented Studio</h1><p>Revised reference beside an actual browser capture. Actual saved records and geometry differ from the fictional design specimen.</p><a href="index.html">Original → revised designs</a><a href="http://127.0.0.1:3000/studio/work">Open app</a></header><nav aria-label="Screen"></nav><main><figure><figcaption>Revised reference</figcaption><img id="reference" alt="Revised design reference"></figure><figure><figcaption>Actual application</figcaption><img id="actual" alt="Actual production browser capture"></figure></main><script>const screens=[['queue','Work queue','04-work-queue.png'],['intake','Add files','05-add-files.png'],['workspace','Review details','01-plan-review.png'],['map','Map','02-map.png'],['register','Property Register','03-register.png']];function show(id){const s=screens.find(s=>s[0]===id)||screens[0];document.querySelector('#reference').src=s[2];document.querySelector('#actual').src='actual/'+s[0]+'.png';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.datase
