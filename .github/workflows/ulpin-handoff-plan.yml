name: ULPIN active handoff plan

# Documentation/receipt consistency only. No app services, deployment or secrets.
on:
  push:
    branches: [staging]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/usp-agent-handoffs/**'
      - 'docs/engineering-plan/CURRENT_WORK.md'
      - 'docs/evidence/usp/**'
      - '.github/workflows/ulpin-handoff-plan.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/usp-agent-handoffs/**'
      - 'docs/engineering-plan/CURRENT_WORK.md'
      - 'docs/evidence/usp/**'
      - '.github/workflows/ulpin-handoff-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ulpin-handoff-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-active-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate active links, releases and receipt metadata
        run: python3 docs/usp-agent-handoffs/tools/validate_handoffs.py
      - name: Prove stale or inconsistent plans are rejected
        run: python3 -m unittest discover -s docs/usp-agent-handoffs/tools/tests -v
