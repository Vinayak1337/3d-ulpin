name: Apply Sarvam account clarification
on:
  push:
    branches: ['docs/ai-gateway-orchestration-20260923']
    paths: ['.github/workflows/ulpin-account-clarification.yml']
permissions:
  contents: read
concurrency:
  group: ulpin-account-clarification
  cancel-in-progress: false
jobs:
  docs:
    if: github.repository == 'Vinayak1337/3d-ulpin' && github.ref == 'refs/heads/docs/ai-gateway-orchestration-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify base and apply exact documentation-only clarification
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'd7accb0679047aab8d3fb497ece0d23d8abcbda5'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, subprocess
          expected_old = {
          'docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md':'f10ba541b3f0891ea0bf7ba6112aea7f2d1c4d83',
          'docs/usp-agent-handoffs/02-lead-agent-execution.md':'2be1de98a65d442336096180c443f957647f2917',
          'docs/usp-agent-handoffs/90-required-human-tasks.md':'3ada2e73af7b4734e916e6e201cb6ff786a6dac0'}
          expected_new = {
          'docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md':'509d6453851a41a043bea77209a4308b0f513035',
          'docs/usp-agent-handoffs/02-lead-agent-execution.md':'d05c4ecb9ef97e100870ca6ab8a7af6e87cf2202',
          'docs/usp-agent-handoffs/90-required-human-tasks.md':'f434b2429939baeebcfbf64a7fe148e6edcf2e64'}
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          old = {}
          for name, sha in expected_old.items():
              data = Path(name).read_bytes()
              assert blob(data) == sha, f'Source drift: {name}'
              old[name] = data.decode('utf-8')

          from pathlib import Path
          root=Path('.')
          p=root/'docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md'
          s=p.read_text()
          def one(old,new):
           global s
           assert s.count(old)==1,(old[:70],s.count(old))
           s=s.replace(old,new,1)
          one('## A. Outcome and the correction to the key-cycling idea','## A. Outcome and account-aware key cycling')
          one('Required behavior:\n','''**Project-specific clarification from the user, 23 September 2026:** each existing key intended for this project comes from a different Sarvam account, with a reported ₹100 introductory grant for each account. Use the **independent-account configuration**, normally one credential linked to each distinct organisation billing pool and account rate-limit scope. Do not default this supplied set to one shared ₹100 wallet. This records the user's setup, not a provider-confirmed balance check: exact organisation IDs, remaining credit and permitted project allocation are still enrolled through the secret-safe operator flow. Additional keys later created under an existing organisation do not add another grant.

          Required behavior:
          ''')
          one('Use a stable HMAC fingerprint', '''For this project's enrollment, prepare one connection entry per supplied account: opaque account label, actual organisation/workspace IDs, secret reference, distinct billing-pool/rate-scope identity, reported grant amount and provenance, observed remaining balance/time, approved allocation, priority and allowed data/purposes. Mark the ₹100 grant as `user_reported` until evidence is recorded; do not initialize remaining credit from the grant or key count. Preserve balances already consumed elsewhere. If two entries resolve to the same organisation, collapse their funding identity instead of duplicating funds. Distinct verified organisations retain independent ledgers; a missing balance/approval disables that entry, not other qualified entries. Do not ask again whether the user's keys are from different accounts; request only genuinely missing enrollment fields.

          Use a stable HMAC fingerprint''')
          one('Do not automatically revoke keys at Sarvam;', '''**Configured rollover for the supplied independent accounts:** use a stable operator-approved order (priority, then opaque connection ID), keep the current eligible pool until its affordability/threshold rule closes new admission, then advance to the next qualified pool permitted for that task and data. Persist the active selection and its version alongside the existing route policy/selection state; coordinate selection changes with E3's locked reservation so concurrent workers cannot independently reset or wrap the list. Approval of the pool list authorizes routine threshold rollover without another user prompt at each switch; it does not authorize new accounts, new funding or a different processing boundary. This is ordered progression, not per-request round-robin. If all eligible pools are exhausted, draining, retired, unqualified or otherwise unavailable, return the explicit no-funding/capability state and preserve manual work. Do not revisit terminal credentials. A transient 429 or ambiguous potentially charged request never triggers this budget rollover.

          Do not automatically revoke keys at Sarvam;''')
          one('No credentials were supplied or inspected for this plan. No real balance, endpoint compatibility, billing reconciliation or runtime quality is claimed passed.', 'The user supplied the account topology and reported ₹100 grant per account, not secret values or live balance evidence. No credentials were inspected; no real balance, endpoint compatibility, billing reconciliation or runtime quality is claimed passed.')
          one('| G-24 | Demonstrate actual D0 mapping → qualified recipe → subsequent batch conversion without repeated inference, plus D4 literal field preservation. No invented height/CRS/owner. |', '''| G-24 | Demonstrate actual D0 mapping → qualified recipe → subsequent batch conversion without repeated inference, plus D4 literal field preservation. No invented height/CRS/owner. |
          | G-25 | Supplied topology: three distinct account/organisation fixtures, one key each, each with a verified unused ₹100 allocation, retain three independent ledgers (₹300 gross allocated, before per-pool headroom and project caps). Spend on A does not debit B/C. Same-organisation aliases still follow G-01. |
          | G-26 | A reports a ₹100 signup grant but its observed remaining balance is ₹64: admit against only the approved remainder, never refill it to ₹100. Unverified B remains ineligible while qualified C can operate within its own permissions; account count is not spend authority. |
          | G-27 | Ordered A → B → C rollover at the reservation-aware soft ceiling survives concurrent callers, restart and reordered config. A drains only admitted jobs and becomes terminal; later admission never wraps to A. Exhausting the final eligible pool gives unavailable/manual fallback, not reset, top-up or another signup. |''')
          one('No ₹100-per-key assumption, promo farming, rate-limit evasion, secret commits, automatic recharge, invented balance endpoint, direct registry writes or unapproved provider fallback.', "Use the user's confirmed separate-account setup: one existing key per independently funded account, with a reported ₹100 grant each, ordered threshold rollover and persistent retirement. Verify actual organisation identity, remaining balances and permitted allocations; the grant is not a fresh per-key allowance. No promo farming, rate-limit evasion, secret commits, automatic recharge, invented balance endpoint, direct registry writes or unapproved provider fallback.")
          p.write_text(s)

          p=root/'docs/usp-agent-handoffs/02-lead-agent-execution.md';s=p.read_text()
          one('## 1. Max versus Ultra: execution surface matters', '''**Runtime account clarification, 23 September 2026:** the user has one existing Sarvam key per separate account, with a reported ₹100 introductory grant per account. Use H20's independent-account onboarding and ordered budget rollover, not an assumption that all supplied keys share one wallet. Actual remaining balances and enrollment permissions are separate from that reported grant. Lead/worker model choices are unchanged.

          ## 1. Max versus Ultra: execution surface matters''')
          one('''Implement H20's organisation-level credit pools and per-key attribution.
          The published Rs100 signup credit is not per API key. Verify actual funding
          and group keys sharing a wallet/rate pool. Reserve worst-case cost before
          calls, settle exact usage, retain unknown charge exposure, obey account-wide
          throttles, and never revive terminally retired credentials after restart,
          re-enrolment or an old backup. A 429 cooldown is not exhaustion and must not
          trigger rate-limit evasion. Cross-pool failover requires legitimate funding
          and permission for the same data. No signup automation, auto-top-up,
          secret logging or sending restricted records to unapproved providers.''', '''Implement H20's organisation-level credit pools and per-key attribution.
          USER-CONFIRMED SETUP: each existing key is from a different Sarvam account,
          with a reported Rs100 introductory grant per account. Configure separate
          account/organisation pools and their rate-limit scopes, one key each;
          do not combine this supplied set into one Rs100 wallet. Enroll actual IDs,
          current remaining balances, approved allocations and secret references.
          A reported initial grant is not verified remaining credit. Additional keys
          from the same organisation must share its existing pool, not mint funding.

          Use a persisted, operator-approved account order. Reserve worst-case cost,
          then keep the current pool until its admission threshold closes and advance
          to the next eligible approved pool without asking again at each switch.
          Drain admitted document jobs before permanent retirement; never reuse a
          terminal key after restart, re-enrolment, reordered config or old backup.
          Settle actual usage and retain unknown charge exposure. Do not retry a
          possibly charged operation on the next account. A transient 429 is cooldown,
          not exhaustion or permission to evade throttles. When no eligible pool
          remains, preserve pending work and use the no-AI/manual fallback.
          Cross-pool use requires legitimate funding and permission for the same data.
          No signup automation, auto-top-up, secret logging or sending restricted
          records to unapproved providers.''')
          p.write_text(s)

          p=root/'docs/usp-agent-handoffs/90-required-human-tasks.md';s=p.read_text()
          one('The accountable owner supplies approved organisation/workspace/rate-limit group identifiers, evidence of the actual remaining balance and permitted allocation, credential secret references, and data-retention/training/residency decisions.', '''**Already supplied by the user (23 September 2026):** every existing key intended for this project belongs to a different Sarvam account, with a reported ₹100 introductory grant per account. Prepare the independent-account template in H20; do not ask the user to repeat this clarification or assume one shared wallet for the supplied set. This is not verification of current remaining credit or authorization to open more accounts.

          The accountable owner supplies only the still-missing approved organisation/workspace/rate-limit group identifiers, evidence of the actual remaining balance and permitted allocation per account, credential secret references, and data-retention/training/residency decisions.''')
          p.write_text(s)

          for name, sha in expected_new.items():
              text = Path(name).read_text()
              assert blob(Path(name).read_bytes()) == sha, f'Unexpected patch: {name}'
              assert text.count('```') % 2 == 0
              assert set(re.findall(r'\]\(([^)]+)\)', text)) == set(re.findall(r'\]\(([^)]+)\)', old[name]))
              print('Verified patched blob', name, sha)
          gateway = Path('docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md').read_text()
          assert re.findall(r'^## ([A-K])\.', gateway, re.M) == list('ABCDEFGHIJK')
          assert re.findall(r'^\| (G-\d+) \|', gateway, re.M) == [f'G-{i:02d}' for i in range(1, 28)]
          lead = Path('docs/usp-agent-handoffs/02-lead-agent-execution.md').read_text()
          prompt = lead.split('## 6. Ready-to-paste lead prompt\n\n```text\n', 1)[1].split('\n```',1)[0]
          assert 'USER-CONFIRMED SETUP' in prompt
          Path('.github/workflows/ulpin-account-clarification.yml').unlink()
          print('PASS: 3 exact edits; 27 gateway acceptance scenarios; unchanged Markdown destinations; balanced fences; lead prompt synchronized.')
          PY
          git diff --check
          git add docs/usp-agent-handoffs/02-lead-agent-execution.md docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md docs/usp-agent-handoffs/90-required-human-tasks.md .github/workflows/ulpin-account-clarification.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          test "$(git diff --cached --diff-filter=M --name-only | wc -l)" -eq 3
          test "$(git diff --cached --diff-filter=D --name-only)" = '.github/workflows/ulpin-account-clarification.yml'
      - name: Publish only to the existing documentation branch
        env:
          PUSH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH='docs/ai-gateway-orchestration-20260923'
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: clarify separate Sarvam account pools and synchronize lead prompt'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
