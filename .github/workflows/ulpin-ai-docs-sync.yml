name: ULPIN AI documentation synchronization
on:
  push:
    branches: ['docs/ai-gateway-orchestration-20260923']
    paths: ['.github/workflows/ulpin-ai-docs-sync.yml']
permissions:
  contents: read
concurrency:
  group: ulpin-ai-docs-sync
  cancel-in-progress: false
jobs:
  docs:
    if: github.repository == 'Vinayak1337/3d-ulpin' && github.ref == 'refs/heads/docs/ai-gateway-orchestration-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BRANCH: docs/ai-gateway-orchestration-20260923
      EXPECTED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false
      - name: Apply exact documentation updates and verify preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import pathlib, re, subprocess, json, os, hashlib, posixpath
          from urllib.parse import unquote, urlsplit
          folder = 'docs/usp-agent-handoffs/'
          names = {
            '00': '00-README.md', '01': '01-shared-contracts-and-ownership.md',
            '14': '14-adaptive-ingestion-and-progressive-review.md',
            '18': '18-grounded-assistance-and-mcp.md', '19': '19-india-contained-deployment.md',
            '90': '90-required-human-tasks.md', '99': '99-ui-ux-and-integration.md',
          }
          expected = {
            'AGENTS.md': '63038c1fa991f7a595c288c0f6eafde99f23b226',
            folder+names['00']: '73c0e8674ba760f3fb65253984d1e8f39b86f27d',
            folder+names['01']: 'eea7f360caadd316b70b8f8e9f64690a43f3c8cf',
            folder+names['14']: '4b422cef70f9609bfb38f59ea7c8db2e4564e975',
            folder+names['18']: '91c82b959ec812d828220d6cf65d013d39838110',
            folder+names['19']: '2184b04c08ccaccfd03f5bad5d57c75d6da4ede0',
            folder+names['90']: 'c38c771a617b55513891c18a607cf498cccda861',
            folder+names['99']: 'ba1a8bc29f67d6cb298165a6b8c3a2c6d25c3d55',
          }
          def git(*args): return subprocess.check_output(['git',*args], text=True).strip()
          for path, sha in expected.items():
            assert git('hash-object',path)==sha, 'Unexpected source drift: '+path
          paths = [*expected, 'README.md']
          before = {p:pathlib.Path(p).read_text() for p in paths}
          texts = dict(before)
          def get(k): return folder+names[k]
          def replace(path, old, new):
            assert texts[path].count(old)==1, 'Missing/ambiguous anchor: '+path+' '+old[:80]
            texts[path]=texts[path].replace(old,new,1)
          def before_heading(path, heading, addition): replace(path,heading,addition+'\n\n'+heading)
          def notice(path,text):
            title, rest=texts[path].split('\n',1)
            texts[path]=title+'\n\n'+text+'\n'+rest
          gateway='[20 - Sarvam gateway, credit pools and permanent credential retirement](20-model-gateway-and-budget-pools.md)'
          leader='[02 - Astra Max lead and explicit worker delegation](02-lead-agent-execution.md)'
          notice(get('00'), '**Execution/provider update, 23 September 2026:** use '+leader+' and '+gateway+'. These are supporting instructions for existing roles, not additional independent USPs. The gateway is planned, not live-qualified. Reconcile older starter status below against current code and FND evidence; the inspected implementation base for this update is `codex/fnd-f0-f1@97146d6`.')
          old=next(l for l in texts[get('00')].splitlines() if l.startswith('**Recommended model routing, not a measured project benchmark:**'))
          replace(get('00'),old,'**Current model routing (23 September 2026):** Astra Max is the hands-on integration lead. Spawn only GPT-6 Sol or GPT-6 Astra workers when independent work benefits: Sol Medium for bounded read-only exploration, Sol High for DATA/ordinary leaves, Sol XHigh for integration-heavy leaves, Astra High for specific high-risk diagnosis and Astra Max for a persistent hard blocker. Use H02 for exact assignment, settings verification and ownership. Default to at most two spawned threads, no nested spawning, and preserve existing total ownership limits. Do not infer quality or cost from an effort label. Runtime Sarvam profiles/billing are separate and follow H20; no per-key free-credit assumption.')
          replace(get('00'),'| Current scope | F0a common validation/data-pack starter implemented;', '| Historical starter scope | F0a common validation/data-pack starter implemented;')
          replace(get('00'),'**What to do next:** one FND owner completes remaining F0 then F1-min; DATA prepares full D0 and attempts bounded D1/D4 acquisition.', '**What to do next:** one FND owner first inspects current implementations and receipts, then completes only remaining foundation/integration gaps; DATA verifies existing D0/D1/D4 work before preparing or acquiring anything missing.')
          notice(get('01'),'**Current continuation note, 23 September 2026:** '+leader+' governs development workers. '+gateway+' specifies DEPLOY-owned runtime inference, money reservations, shared organisation wallets and one-way key retirement. Current [ports](../../packages/contracts/src/usp/ports.ts), [domain types](../../packages/contracts/src/usp/domain.ts) and [FND interfaces](../evidence/usp/fnd/INTERFACES.md) have advanced beyond the historical F0a note below. Their existence does not qualify the provider gateway; inspect actual bindings/tests rather than recreate these modules.')
          replace(get('01'),'## Implementation state — F0a starter, not all of F0','## Historical F0a checkpoint — reconcile with current implementation')
          replace(get('01'),'**Still to implement for F0/F1:**','**Remaining at the original F0a checkpoint, not a current code inventory:**')
          before_heading(get('01'),'## 3. Immutable snapshots and historical reads','### Runtime model adapter integration (H20)\n\nReuse and evolve the actual `UspModelGatewayRequestSchema`/result and `UspPorts.modelGateway`, not another client. FND owns compatible task/receipt/async-job envelopes, deployment permissions and additive migration registration; DEPLOY owns price versions, organisation pools, per-key attribution, atomic reservations, usage reconciliation, shared throttles and retirement tombstones described in H20. INGEST/ASSIST pass exact authorised inputs, not keys, model URLs or caller-supplied balances. Snapshot/input/scene and provider-job identities remain distinct. Billing settlement occurs even when stale output cannot be applied; missing ledger/retirement state fails closed for new paid calls. No SQL transaction spans a provider call. Test two keys sharing one wallet, simultaneous reservations, unknown outcomes, restore/re-enrolment and permission-safe settings before live qualification.')
          for key in ['14','18','19']:
            notice(get(key),'**Provider-plan update, 23 September 2026:** '+gateway+' is required for this feature\'s model integration. Use '+leader+' for development-worker selection. These instructions do not claim a live provider, funded account or passing new tests.')
          before_heading(get('14'),'## F. Exact implementation map','### 8. Governed AI calls, budgets and fallback\n\nConsume H20 through the existing modelGateway. Use Sarvam 105B V1 for bounded mapping/text interpretation; document OCR uses a separately qualified asynchronous Vision path, not a raw LiDAR-to-JSON LLM. Qualified recipe reuse precedes new inference; record model/prompt/schema/source/price receipt references. A retry or repair shares the task\'s total attempts, deadline and monetary reservation budget across every key. An exhausted organisation disables its whole key group; throttling waits and never bypasses account limits. Provider/ledger failure retains received sources and accepted drafts and exposes manual mapping or needs-input. Do not add an independent key cycler, billing counter, network client or per-import trainer. Returned token fragments never directly update geometry.')
          before_heading(get('14'),'## K. Copy-paste assignment','**Additional H20 acceptance:** simulate two worker processes contending for the same final balance, account exhaustion across several keys, terminal retirement after restart, timeout with unknown charge, policy revocation and manual-mapping recovery. Prove a qualified source family reuses its recipe without another model call. Preserve the original INGEST recovery/replay tests; budget tests do not qualify scene rendering.')
          before_heading(get('18'),'## F. Exact implementation map','### Runtime gateway and billing boundary\n\nASSIST0 remains deterministic and requires no model wallet. Optional routing uses H20\'s authorised Sarvam profile through the existing gateway, with typed factual blocks retaining H18 authority. Do not expose key aliases, billing-pool identifiers, balances or provider error bodies to a property user. Budget exhaustion, cooldown or an unqualified provider falls back to available typed service facts and native actions, not another model provider. Result reuse still requires current source/target grants. Development GPT workers in H02 are not runtime property processors. Optional paraphrase remains separately evaluated and is never enabled merely because a key is funded.')
          before_heading(get('18'),'## K. Copy-paste assignment','**Additional H20 acceptance:** zero-key, exhausted-wallet and 429 scenarios still return correct available typed facts without leaking settings. Revoke evidence access during a pending answer and verify neither cached model text nor a fallback discloses it. Any optional model call shares H20\'s two-attempt and money caps; no hidden second client.')
          start='### Model gateway: one network owner'
          end='### Scanner and mail adapters'
          i=texts[get('19')].index(start); j=texts[get('19')].index(end,i)
          paragraphs=[start,
            'Implement the existing FND gateway using [H20](20-model-gateway-and-budget-pools.md), which is the detailed adapter specification for this DEPLOY workstream. It defines selected models/prices, organisation wallets, per-key attribution, bounded calls, shared rate limits, atomic reservations, ambiguous billing, permanent credential retirement and the operator settings tests. Do not duplicate those mechanisms in consumers or create a separate gateway.',
            'The initial model set is Sarvam 105B V1 for bounded schema mapping/extracted text, and separately qualified Vision document digitisation for scans. ASSIST0 stays deterministic. Managed 30B is deprecated. No LLM reads raw point-cloud arrays into invented cadastral geometry. Check the exact endpoint/price/capability against H20\'s dated sources and actual live qualification before use. Keys enter through secret references, not Git/chat/browser configuration.',
            'Sarvam\'s introductory credit is per new user, while organisation balances and account rate limits are shared by keys. Authorised rollover must not multiply the shared balance or bypass throttling. Retired credentials never resume after restart/re-enrolment; draining admitted document jobs and transient cooldown are distinct states. Unknown provider charge is retained as exposure, not silently refunded. A funded key is not proof of data-transfer permission.',
            'Keep the current synchronous two-attempt/45-second/1 MiB caps as total task bounds, including retries and repair; asynchronous document jobs use existing durable jobs and their own qualified page budget. Count reasoning inside completion usage once. Provider token streaming is not geometry SSE. FND routes or disables the legacy Nous path; no unapproved paid/model/geography fallback. No-key and exhausted-budget modes keep manual mapping and typed answers useful. Later training stays outside live ingestion.'
          ]
          texts[get('19')]=texts[get('19')][:i]+'\n\n'.join(paragraphs)+'\n\n'+texts[get('19')][j:]
          before_heading(get('19'),'## K. Copy-paste assignment','**H20 is part of DEPLOY acceptance:** execute its G-01 through G-24 tests as applicable. Qualify local ledger/fake-provider behavior separately from live chat, live document billing and deployment residency. No public balance API, real key pool or permanent post-restore memory is assumed. Operator account evidence is required before funded calls, not before fixture implementation.')
          replace(get('19'),'No automatic credit purchase or model switch.','No automatic credit purchase or unapproved model/funding/geography switch; only pre-authorised H20 rollover is permitted.')
          notice(get('90'),'**Account/delegation update, 23 September 2026:** '+leader+' keeps engineering with agents; '+gateway+' defines the narrow runtime credential/funding prerequisites. Never request raw keys in chat or Git.')
          before_heading(get('90'),'## H4. Observe the completed workflow, without becoming its tester/developer','### H3a. Runtime AI account evidence and secrets\n\nThe accountable owner supplies approved organisation/workspace/rate-limit group identifiers, evidence of the actual remaining balance and permitted allocation, credential secret references, and data-retention/training/residency decisions. Keys from one organisation share funds; do not list Rs100 independently for each. An independently funded fallback requires explicit permission for this project/data and legitimate credit entitlement; no automated signup or rate-limit evasion. Store secrets through the environment/secret mechanism, not public evidence. Agents implement H20, prepare the configuration template, fingerprint/group credentials without logging values, test the fake provider and produce one precise remaining live prerequisite. Absent credentials or balance evidence blocks live qualification only, not no-AI/manual operation or local tests.')
          notice(get('99'),'**AI settings/delegation update, 23 September 2026:** use '+leader+' for worker ownership and '+gateway+' for the DEPLOY settings leaf. These are not new top-level product screens or a reason to delay the existing V0 scene.')
          before_heading(get('99'),'## 8. Visual and interaction acceptance — V1 through V8','### Governed AI settings in the existing workspace dialog\n\nMount DEPLOY\'s H20 settings leaf only for permitted operators. Show per-task model profile, organisation-shared funding, local spend/reserved/uncertain amounts, last verified balance observation and safe credential state/history. Distinguish active, draining, cooldown, retired and unqualified; terminal retirement has no reactivate control. Do not show raw keys, fingerprints or billing metadata in the quick/full property register, public pages, tooltips or API errors. Ordinary workflows retain their selected property, useful drafts, manual mapping and typed answers when AI is unavailable. A settings save cannot enable an unqualified provider or override deployment boundaries.')
          before_heading(get('99'),'## 11. Copy-paste UI assignment','**Additional settings verification:** use fake credentials and ledger receipts to exercise shared-wallet display, permanent retirement after reload, pending/unknown cost, cooldown and access denial at desktop/mobile sizes. Prove expired/revoked operator grants clear settings and suppress late responses. Do not treat these screens as live provider/residency qualification.')
          notice('README.md','**Current execution and runtime AI:** [Astra Max lead with explicit Sol/Astra workers](docs/usp-agent-handoffs/02-lead-agent-execution.md); [planned Sarvam gateway, shared credits and permanent key retirement](docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md). These dated additions are implementation instructions, not a claim that provider accounts or live inference are configured.')
          replace('AGENTS.md','are copied without semantic changes from `e167b1f`; new paths/types in them are','originate at `e167b1f` and include explicitly dated updates; new paths/types are')
          replace('AGENTS.md','Do not send private records to an\nexternal model.','Do not send private records to an\nunapproved external model.')
          before_heading('AGENTS.md','## Verification and cleanup discipline','### Current worker and runtime-provider rules\n\nRead `docs/usp-agent-handoffs/02-lead-agent-execution.md`: Astra Max is the\nhands-on lead; only GPT-6 Sol/Astra workers may be spawned with explicit,\nverified model/effort settings. Spawn useful independent work within existing\nownership limits, at most two child threads initially; only the lead spawns.\nUnsupported model selection means explicit serial fallback, not another family.\n\nRead `docs/usp-agent-handoffs/20-model-gateway-and-budget-pools.md` for runtime\nSarvam integration. DEPLOY owns provider clients, shared organisation wallets,\nper-key usage, exact cost reservations, account throttles and retirement memory.\nRs100 signup credit is not per key. Never revive retired keys, bypass account\nlimits, farm signup credits, purchase funding or expose secrets. Use fake\nproviders/no-AI paths until authorised account and live-call gates are met.\nThese runtime budgets and data permissions are separate from coding-agent usage.')
          for path, text in texts.items():
            assert text != before[path], 'No update: '+path
            assert text.count('```')%2==0, 'Fence mismatch: '+path
            pathlib.Path(path).write_text(text)
          new=[folder+'02-lead-agent-execution.md',folder+'20-model-gateway-and-budget-pools.md']
          for path in new:
            text=pathlib.Path(path).read_text(); assert text.count('```')%2==0
          for key in ['14','18','19']:
            for ch in 'ABCDEFGHIJK': assert len(re.findall(r'^## '+ch+r'\.',texts[get(key)],re.M))==1
          def broken(path,text):
            found=set()
            for url in re.findall(r'\]\(([^\s)]+)\)',text):
              if url.startswith(('#','http:','https:','mailto:')): continue
              raw=unquote(urlsplit(url).path)
              if not raw: continue
              target=pathlib.Path(posixpath.normpath(str(pathlib.PurePosixPath(path).parent/raw)))
              if not target.exists(): found.add(url)
            return found
          introduced={p:sorted(broken(p,texts[p])-broken(p,before[p])) for p in paths}
          for p in new: introduced[p]=sorted(broken(p,pathlib.Path(p).read_text()))
          assert not any(introduced.values()), str(introduced)
          assert 'Do not assign complete handoffs to Low or buy Max effort by default' not in texts[get('00')]
          for k in ['00','01','14','18','19','90','99']: assert '20-model-gateway-and-budget-pools.md' in texts[get(k)]
          assert '02-lead-agent-execution.md' in texts['AGENTS.md']
          changed=set(git('diff','--name-only').splitlines()); assert changed==set(paths), str(changed)
          subprocess.run(['git','diff','--check'],check=True)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ulpin-ai-docs';out.mkdir()
          for p in paths+new:
            dest=out/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(pathlib.Path(p).read_bytes())
          report={'base':'97146d62d7e64c946abfc98b0d7e670845b17857','input_sha':os.environ['EXPECTED_HEAD'],
            'updated_existing':paths,'new_documents':new,'checks':['exact source blob guards','bounded documentation-only diff','A-K preservation','balanced fences','zero newly broken relative Markdown targets','cross-handoff gateway/delegation links','git diff --check'],
            'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths+new},
            'not_run':['application tests','live Sarvam calls/balances','worker model selection','deployment','new adapter implementation']}
          (out/'verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'updated_documents':len(paths),'new_documents':len(new),'introduced_broken_targets':0,'runtime_files_changed':0}))
          PY
      - name: Publish only the documentation changes
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git add AGENTS.md README.md docs/usp-agent-handoffs/
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile gateway budgets and worker delegation across original handoffs [skip ci]'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$PUSH_TOKEN"; }; f' push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD > "$RUNNER_TEMP/ulpin-ai-docs/published-commit.txt"
      - name: Retain documentation and check results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ulpin-ai-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/ulpin-ai-docs/
          if-no-files-found: warn
          retention-days: 7
