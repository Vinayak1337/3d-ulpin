name: ULPIN contract conformance
on:
  push:
    branches: [feat/unified-spatial-foundation]
    paths:
      - 'packages/contracts/**'
      - 'apps/web/features/spatial/data/core-*.ts'
      - 'apps/web/lib/server/spatial-core-*.ts'
      - 'apps/web/app/api/v1/spatial/core/**'
      - 'scripts/contracts/**'
      - 'fixtures/contracts/**'
      - 'tests/core-*.test.ts'
      - 'tests/fixtures/core-*.ts'
      - 'services/geo/tests/test_core*.py'
      - 'services/geo/requirements-dev.txt'
      - 'services/geo/requirements.txt'
      - 'services/geo/geo/core_*.py'
      - 'services/geo/geo/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ulpin-contracts.yml'
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'apps/web/features/spatial/data/core-*.ts'
      - 'apps/web/lib/server/spatial-core-*.ts'
      - 'apps/web/app/api/v1/spatial/core/**'
      - 'scripts/contracts/**'
      - 'fixtures/contracts/**'
      - 'tests/core-*.test.ts'
      - 'tests/fixtures/core-*.ts'
      - 'services/geo/tests/test_core*.py'
      - 'services/geo/requirements-dev.txt'
      - 'services/geo/requirements.txt'
      - 'services/geo/geo/core_*.py'
      - 'services/geo/geo/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ulpin-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ulpin-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked JavaScript and pinned schema validator
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Schema authority and shared corpus parity
        run: |
          node scripts/contracts/authority-experiment.mjs check
          python scripts/contracts/authority-parity.py
          pnpm exec tsx scripts/contracts/export-core.ts check
          pnpm exec tsx --test tests/core-*.test.ts
          python scripts/contracts/core-parity.py
          pnpm typecheck
