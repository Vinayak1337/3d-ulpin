name: ULPIN isolated integration baseline

on:
  push:
    branches: [feat/unified-spatial-foundation, feat/studio-reference-rebuild]
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/contracts/**'
      - 'services/geo/**'
      - 'scripts/engineering/**'
      - 'scripts/spatial/**'
      - 'tests/**'
      - 'repo-data/**'
      - 'data-bundles/**'
      - 'compose.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ulpin-integration-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ulpin-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REPO_DATA: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies and browser
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Test isolation and baseline tools before any data operation
        run: |
          node --test tests/engineering-*.test.mjs tests/spatial-network.test.mjs
          python3 docs/engineering-plan/tools/validate_plan.py
          python3 -m unittest discover -s docs/engineering-plan/tools/tests -p 'test_*.py' -v
      - name: Existing pure and cross-view regressions
        run: |
          pnpm exec tsx scripts/contracts/export-core.ts check
          pnpm exec tsx --tsconfig apps/web/tsconfig.json --test tests/core-*.test.ts
          pnpm test:spatial
          pnpm test:studio
          pnpm test:scene
          pnpm test:repo-data
          pnpm test:register-scope
          pnpm test:ui
          pnpm test:uttam
          pnpm test:ai
          pnpm typecheck
      - name: Build the actual production application
        run: pnpm build
      - name: Create this attempt's isolated environment
        run: node scripts/engineering/isolation.mjs --prepare
      - name: Restore, preserve, migrate, process, render and clean up
        run: node scripts/engineering/isolated-baseline.mjs
      - name: Upload only scoped test results, never credentials or originals
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ulpin-isolated-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/engineering/*.json
            .runtime/engineering/*.log
            .runtime/engineering/api-*.md
            .runtime/spatial-qa/*.json
            .runtime/spatial-qa/*.png
            .runtime/neighbourhood-qa/*.json
            .runtime/neighbourhood-qa/*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 5
