name: USP foundation starter
on:
  push:
    branches: ['feat/usp-foundation-f0']
    paths: ['packages/contracts/**', 'apps/web/lib/server/usp/**', 'apps/web/app/api/v1/usp/**', 'tests/usp-*.test.ts', 'tests/fixtures/usp-*', 'scripts/usp/**', 'fixtures/usp/**', '.github/workflows/usp-foundation.yml']
  pull_request:
    paths: ['packages/contracts/src/usp/**', 'apps/web/lib/server/usp/**', 'apps/web/app/api/v1/usp/**', 'tests/usp-*.test.ts', 'tests/fixtures/usp-*', 'scripts/usp/**', 'fixtures/usp/**', '.github/workflows/usp-foundation.yml']
permissions:
  contents: read
concurrency:
  group: usp-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
      - name: Run contract, byte-integrity and existing regression checks
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          out = pathlib.Path('.runtime/usp-f0'); out.mkdir(parents=True, exist_ok=True)
          commands = [
            ('contract-tests', 'pnpm exec tsx --tsconfig apps/web/tsconfig.json --test tests/usp-foundation.test.ts tests/usp-data-pack.test.ts tests/usp-contract-producers.test.ts'),
            ('starter-types', 'pnpm exec tsc --noEmit --target ES2022 --module esnext --moduleResolution bundler --strict --skipLibCheck --types node tests/usp-foundation.test.ts tests/usp-data-pack.test.ts tests/fixtures/usp-common.ts'),
            ('pack-bytes', 'pnpm exec tsx scripts/usp/data/verify-pack.ts fixtures/usp/D0/contract-smoke/manifest.json'),
            ('typecheck', 'pnpm typecheck'),
            ('studio', 'pnpm test:studio'),
            ('scope', 'pnpm test:register-scope'),
            ('core', 'pnpm exec tsx --tsconfig apps/web/tsconfig.json --test tests/core-*.test.ts'),
            ('uttam', 'pnpm test:uttam'),
            ('repo-data', 'node --test tests/repo-data-mode.test.mjs'),
            ('unchanged-checkout', 'git diff --exit-code && git diff --check'),
          ]
          checks = []
          for name, command in commands:
            start = time.monotonic()
            with (out / (name + '.log')).open('w') as log:
              try:
                code = subprocess.run(['bash', '-o', 'pipefail', '-c', command], stdout=log, stderr=subprocess.STDOUT, timeout=180).returncode
              except subprocess.TimeoutExpired:
                code = 124
            checks.append({'name': name, 'command': command, 'exit_code': code, 'seconds': round(time.monotonic() - start, 2)})
            print(name, 'PASS' if code == 0 else 'FAIL', flush=True)
            if code: print((out / (name + '.log')).read_text()[-8000:], flush=True)
          report = {'schemaVersion': 'usp-f0-verification/1', 'code_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'node': subprocess.check_output(['node','--version'], text=True).strip(), 'run_id': os.environ['GITHUB_RUN_ID'], 'checks': checks, 'not_run': ['live DB/storage/worker integration (separate isolated-baseline workflow)', 'real-source D1/D4 acquisition', 'full D0 neighbourhood', 'browser/GPU/V0', 'model hosting', 'F2/deployment']}
          (out / 'verification.json').write_text(json.dumps(report, indent=2)+'\n')
          if any(c['exit_code'] for c in checks): raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: usp-f0-verification-${{ github.run_id }}
          path: .runtime/usp-f0/
          retention-days: 7
          if-no-files-found: warn
