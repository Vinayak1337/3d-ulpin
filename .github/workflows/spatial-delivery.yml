name: Apply and verify reviewed spatial sources
on:
  push:
    branches: [feat/reusable-spatial-map-core]
    paths: ['.delivery/**']
permissions:
  contents: write
jobs:
  apply-and-verify:
    if: github.ref == 'refs/heads/feat/reusable-spatial-map-core'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply exact reviewed source bundle
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          packed = b''.join((root / '.delivery' / f'{i:02}.part').read_bytes() for i in range(6))
          assert hashlib.sha256(packed).hexdigest() == 'fb69a42b5939bcff2fdb57fb31149451f56482278b70713b4381743b633109cc', 'Source transfer checksum mismatch'
          decoder = lzma.LZMADecompressor(memlimit=256*1024*1024)
          raw = decoder.decompress(packed, max_length=4*1024*1024)
          assert decoder.eof and not decoder.unused_data, 'Invalid source package size'
          package = json.loads(raw)
          assert package['version'] == 1
          empty_sources = {'apps/web/app/api/v1/spatial/areas/[areaId]/route.ts', 'apps/web/app/api/v1/spatial/calibration/[kind]/[...asset]/route.ts'}
          def checked(name):
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert not any(p in ('.git', 'node_modules', '.runtime') or p.startswith('.env') for p in path.parts)
              assert name in ('AGENTS.md', 'README.md', 'package.json', 'packages/contracts/package.json', 'packages/contracts/src/index.ts', 'apps/web/components/AreaViewer.tsx', 'apps/web/components/SpatialViewer.tsx', 'apps/web/features/officer/shared/hooks.ts', 'apps/web/features/officer/shared/store.tsx', 'docs/SHARED_MAP_IMPLEMENTATION.md', 'tests/spatial-core.test.ts', 'scripts/spatial/browser.mjs', 'apps/web/app/(officer)/map-lab/page.tsx') or name.startswith(('apps/web/features/spatial/', 'packages/contracts/src/spatial/', 'apps/web/app/api/v1/spatial/'))
              target = root / path
              assert target.resolve().is_relative_to(root) and not target.is_symlink()
              return target
          def original_bytes(name):
              path = root / name
              if name in empty_sources:
                  assert not path.exists(), f'Unexpected new-route collision: {name}'
                  return b''
              return path.read_bytes()
          for name, expected in package['baseHashes'].items():
              path = checked(name)
              if expected is None:
                  assert not path.exists(), f'Unexpected pre-existing file: {name}'
              else:
                  assert hashlib.sha256(original_bytes(name)).hexdigest() == expected, f'Concurrent source change: {name}'
          outputs = dict(package['files'])
          for copy in package['copies']:
              original = original_bytes(copy['source'])
              assert hashlib.sha256(original).hexdigest() == copy['sourceSha256'], f'Changed copy source: {copy["source"]}'
              text = original.decode('utf-8')
              outputs[copy['path']] = ''.join(text[part[0]:part[1]] if isinstance(part, list) else part for part in copy['parts'])
          assert set(outputs) == set(package['resultHashes']) == set(package['baseHashes']) and len(outputs) == 42
          for name, text in outputs.items():
              assert hashlib.sha256(text.encode()).hexdigest() == package['resultHashes'][name], f'Output mismatch: {name}'
              checked(name)
          for name, text in outputs.items():
              target = checked(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(text.encode('utf-8'))
          subprocess.run(['git', 'add', '--', *sorted(outputs)], check=True)
          print(f'Applied {len(outputs)} individually hash-verified source files.')
          PY
          git diff --cached --check
          git rm -r -- .delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add shared spatial runtime, canonical contracts and streamed map calibration'
          git push origin HEAD:refs/heads/feat/reusable-spatial-map-core
          mkdir -p .runtime/spatial-qa
          git rev-parse HEAD | tee .runtime/spatial-qa/tested-commit.txt
          git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and browser
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Typecheck and pure regressions
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee .runtime/spatial-qa/typecheck.log
          pnpm test:spatial 2>&1 | tee .runtime/spatial-qa/unit-tests.log
          pnpm test:scene
          pnpm test:repo-data
          pnpm test:register-scope
          pnpm test:ui 2>&1 | tee .runtime/spatial-qa/ui-tests.log
      - name: Production build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .runtime/spatial-qa/build.log
      - name: Actual browser rendering and state regression
        run: |
          set -o pipefail
          SPATIAL_START_SERVER=1 pnpm test:spatial:browser 2>&1 | tee .runtime/spatial-qa/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-map-verification-${{ github.run_id }}
          path: .runtime/spatial-qa
          retention-days: 5
