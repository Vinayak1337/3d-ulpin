name: Spatial core
on:
  push:
    branches: [feat/reusable-spatial-map-core]
  pull_request:
    paths:
      - 'packages/contracts/**'
      - 'apps/web/**'
      - 'scripts/spatial/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/spatial-core.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spatial-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact tested source
        run: |
          mkdir -p .runtime/spatial-qa
          git rev-parse HEAD | tee .runtime/spatial-qa/tested-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies and browser
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee .runtime/spatial-qa/typecheck.log
      - name: Shared spatial-core tests
        timeout-minutes: 3
        run: |
          set -o pipefail
          pnpm test:spatial 2>&1 | tee .runtime/spatial-qa/spatial-tests.log
      - name: Existing pure and React regressions
        timeout-minutes: 3
        run: |
          set -o pipefail
          pnpm test:scene 2>&1 | tee .runtime/spatial-qa/scene-tests.log
          pnpm test:repo-data 2>&1 | tee .runtime/spatial-qa/repo-tests.log
          pnpm test:register-scope 2>&1 | tee .runtime/spatial-qa/register-tests.log
          pnpm test:ui 2>&1 | tee .runtime/spatial-qa/ui-tests.log
      - name: Production build
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee .runtime/spatial-qa/build.log
      - name: Actual browser rendering and state regression
        timeout-minutes: 5
        run: |
          set -o pipefail
          SPATIAL_START_SERVER=1 pnpm test:spatial:browser 2>&1 | tee .runtime/spatial-qa/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-map-verification-${{ github.run_id }}
          path: .runtime/spatial-qa
          retention-days: 5
